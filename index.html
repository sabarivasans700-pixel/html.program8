<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Healthy Lifestyle</title>



<style>

body {

    font-family: Arial, sans-serif;

    background-color: #f2f8f5;

    margin: 20px;

}



h1 {

    color: darkgreen;

    text-align: center;

}



.box {

    width: 400px;

    height: 220px;

    background-color: #d9f7d9;

    border: 3px solid green;

    padding: 20px;

    margin: 30px auto;

}



p {

    font-size: 18px;

    color: #333;

    line-height: 1.6;

}



.highlight {

    color: white;

    background-color: #2e8b57;

    padding: 10px;

}

</style>

</head>



<body>



<h1>Healthy Lifestyle</h1>



<div class="box">

    <p>

        A healthy lifestyle includes eating nutritious food,

        exercising regularly, drinking enough water, and getting

        proper sleep every day.

    </p>



    <p class="highlight">

        Good habits today lead to a healthier and happier future.

    </p>

</div>



</body>

</html>
